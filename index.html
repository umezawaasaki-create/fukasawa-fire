<style>
:root{--green:#ca1b28;--red:#2e2e2e;--bg:#f4f4ef;--ink:#262626;--sub:#6b6b6b;--line:#dcdcd6;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.cmp-slot{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}

.cmp-slot figure img{width:100%;height:100%;object-fit:contain}

  var fr=framesOf(document.getElementById(st.id)),f=fr[st.i];
  var btns=fr.map(function(_,j){return '<button type="button" data-side="'+side+'" data-i="'+j+'" aria-pressed="'+(j===st.i)+'" aria-label="'+(j+1)+'コマ目">'+(j+1)+'</button>';}).join('');
  var re=side==='b'?'<button type="button" class="cmp-repick">人を変える</button>':'';
  return '<div class="cmp-slot"><figure><img src="'+f.src+'" alt="'+nameOf(panel,st.id)+' '+(st.i+1)+'コマ目">'+(f.raw?'':'<span class="n">'+(st.i+1)+'</span>')+'</figure><div class="who"><span>'+nameOf(panel,st.id)+'</span>'+re+'</div><div class="cap">'+(f.cap||'&nbsp;')+'</div><div class="cmp-frames">'+btns+'</div></div>';
}
function renderCmp(panel){
  var st=panel._cmp,box=panel.querySelector('.cmp');
  box.innerHTML='<div class="cmp-head"><h2>フォーム比較</h2><button type="button" class="cmp-close">比較をやめる</button></div><div class="cmp-pair">'+slotHTML(panel,st.a,'a')+slotHTML(panel,st.b,'b')+'</div><p class="filter-hint" style="margin-top:6px">画像の下の数字でコマを切り替えられます</p>';
}
function openCmp(panel,id,i){
  var box=panel.querySelector('.cmp');
  if(!box){box=document.createElement('div');box.className='cmp';panel.insertBefore(box,panel.firstChild);
    box.addEventListener('click',function(ev){var t=ev.target,st=panel._cmp;
      if(t.closest('.cmp-close')){closeCmp(panel);return;}if(t.closest('.cmp-repick')){st.b=null;renderCmp(panel);return;}
      var p=t.closest('[data-pick]');if(p){var nid=p.dataset.pick,n=framesOf(document.getElementById(nid)).length;st.b={id:nid,i:Math.min(st.a.i,n-1)};renderCmp(panel);return;}
      var fb=t.closest('.cmp-frames button');if(fb){st[fb.dataset.side].i=+fb.dataset.i;renderCmp(panel);}
    });}
  panel._cmp={a:{id:id,i:i},b:null};
  [].forEach.call(panel.children,function(el){if(el!==box){if(!('cmpHidden' in el.dataset))el.dataset.cmpHidden=el.hidden?'1':'0';el.hidden=true;}});
  box.hidden=false;renderCmp(panel);toTop();
}
function closeCmp(panel){
  var box=panel.querySelector('.cmp');box.hidden=true;box.innerHTML='';panel._cmp=null;
  [].forEach.call(panel.children,function(el){if(el!==box){el.hidden=false;delete el.dataset.cmpHidden;}});
  applyFilter(panel);toTop();
}
[].forEach.call(root.querySelectorAll('section .grid figure'),function(fg){
  var b=document.createElement('button');b.type='button';b.className='cmp-btn';b.textContent='比較';
  var sec=fg.closest('section'),i=[].indexOf.call(fg.parentNode.children,fg);
  b.setAttribute('aria-label',nameOf(sec.closest('[role=tabpanel]'),sec.id)+' '+(i+1)+'コマ目を比較');
  b.addEventListener('click',function(){openCmp(sec.closest('[role=tabpanel]'),sec.id,i);});
  fg.appendChild(b);
});
function panelOf(id){var el=id&&document.getElementById(id);if(!el)return null;var p=el.closest('[role=tabpanel]');return p?p.id.replace('panel-',''):null;}
tabs.forEach(function(t,i){
  t.addEventListener('click',function(){show(t.dataset.tab);history.replaceState(null,'','#'+t.dataset.tab);toTop();});
  t.addEventListener('keydown',function(ev){if(ev.key==='ArrowRight'||ev.key==='ArrowLeft'){var n=tabs[(i+(ev.key==='ArrowRight'?1:tabs.length-1))%tabs.length];n.focus();n.click();}});
});
function fromHash(){var h=location.hash.slice(1);if(h==='serve'||h==='fore'||h==='smash'||h==='back'){show(h);toTop();return true;}var p=panelOf(h);if(p){show(p);selectOnly(document.getElementById('panel-'+p),h);toTop();return true;}return false;}
window._ffHash=fromHash;
if(!fromHash()){var saved=null;try{saved=localStorage.getItem('formTab')}catch(e){}show(saved==='fore'||saved==='smash'||saved==='back'?saved:'serve');}
}
window.addEventListener('hashchange',function(){if(window._ffHash)window._ffHash();});
async function loadDate(d){
  var box=document.getElementById('content');box.innerHTML='<p class="loading">読み込み中…</p>';
  try{var res=await fetch('data/'+d+'.bin');if(!res.ok)throw new Error(res.status);
    var buf=new Uint8Array(await res.arrayBuffer());
    var p=await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(0,12)},KEY,buf.slice(12));
    box.innerHTML=new TextDecoder().decode(p);initContent(box);
    try{localStorage.setItem(DS,d)}catch(x){}
  }catch(x){box.innerHTML='<p class="loading">この日のデータを読み込めませんでした。通信状態を確認して、もう一度開いてください。</p>';}
}
function startApp(){
  document.getElementById('login').hidden=true;document.getElementById('top').hidden=false;
  var sel=document.getElementById('dsel');
  sel.innerHTML=DATES.slice().reverse().map(function(x){return '<option value="'+x.d+'">'+x.label+'</option>';}).join('');
  var saved=null;try{saved=localStorage.getItem(DS)}catch(x){}
  var cur=DATES.some(function(x){return x.d===saved})?saved:DATES[DATES.length-1].d;
  document.getElementById('dbar').hidden=DATES.length<2;
  sel.value=cur;sel.addEventListener('change',function(){loadDate(sel.value);toTop();});
  loadDate(cur);
}
(async function(){try{var s=localStorage.getItem(KS);if(s){KEY=await check(d64(s));startApp();}}catch(x){try{localStorage.removeItem(KS)}catch(y){}}})();
document.getElementById('eye').addEventListener('click',function(){var i=document.getElementById('pw'),on=i.type==='password';i.type=on?'text':'password';this.setAttribute('aria-pressed',on);this.setAttribute('aria-label',on?'パスワードを隠す':'パスワードを表示');i.focus();});
document.getElementById('lf').addEventListener('submit',async function(ev){ev.preventDefault();
  var b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;b.textContent='確認中…';er.textContent='';
  try{var raw=await derive(document.getElementById('pw').value);KEY=await check(raw);
    if(document.getElementById('rem').checked){try{localStorage.setItem(KS,e64(raw))}catch(x){}}
    startApp();
  }catch(x){er.textContent='パスワードがちがいます';b.disabled=false;b.textContent='ひらく';}
});
})();
</script>
